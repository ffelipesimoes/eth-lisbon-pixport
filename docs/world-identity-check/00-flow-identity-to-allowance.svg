<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <rect width="100%" height="100%" rx="12" fill="#0d1117"/>
  <text x="40" y="40" fill="#e6edf3" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700">Identity Check → Tier → Allowance → Pay / RECUSA</text>
  <text x="40" y="64" fill="#8b949e" font-family="Inter,system-ui,sans-serif" font-size="13">World Identity Check (Beta) is the gate that sets the HIP-336 spending tier before Pix is called</text>
  <!-- boxes -->
  <g font-family="Inter,system-ui,sans-serif">
    <rect x="40" y="100" width="150" height="70" rx="10" fill="#1f6feb33" stroke="#1f6feb"/>
    <text x="115" y="130" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="600">BR Code</text>
    <text x="115" y="150" text-anchor="middle" fill="#8b949e" font-size="11">Pix charge</text>

    <path d="M190 135 H230" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

    <rect x="230" y="90" width="200" height="90" rx="10" fill="#8957e533" stroke="#a371f7"/>
    <text x="330" y="120" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="600">World Identity Check</text>
    <text x="330" y="140" text-anchor="middle" fill="#8b949e" font-size="11">verifyCloudProof() · orb</text>
    <text x="330" y="158" text-anchor="middle" fill="#8b949e" font-size="11">Beta product gate</text>

    <path d="M430 135 H470" stroke="#8b949e" stroke-width="2"/>

    <rect x="470" y="90" width="170" height="90" rx="10" fill="#3fb95033" stroke="#3fb950"/>
    <text x="555" y="120" text-anchor="middle" fill="#56d364" font-size="13" font-weight="600">AllowanceTier</text>
    <text x="555" y="140" text-anchor="middle" fill="#8b949e" font-size="11">orb 1M · device 100k</text>
    <text x="555" y="158" text-anchor="middle" fill="#8b949e" font-size="11">none → 0 (reject)</text>

    <path d="M640 135 H680" stroke="#8b949e" stroke-width="2"/>

    <rect x="680" y="90" width="170" height="90" rx="10" fill="#d2992233" stroke="#d29922"/>
    <text x="765" y="120" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="600">HIP-336 check</text>
    <text x="765" y="140" text-anchor="middle" fill="#8b949e" font-size="11">tier cap ∧ remaining</text>
    <text x="765" y="158" text-anchor="middle" fill="#8b949e" font-size="11">allowance</text>

    <!-- outcomes -->
    <path d="M765 180 V210" stroke="#8b949e" stroke-width="2"/>
    <path d="M600 210 H930" stroke="#8b949e" stroke-width="2"/>
    <path d="M600 210 V240" stroke="#3fb950" stroke-width="2"/>
    <path d="M930 210 V240" stroke="#f85149" stroke-width="2"/>

    <rect x="520" y="240" width="160" height="70" rx="10" fill="#3fb95033" stroke="#3fb950"/>
    <text x="600" y="270" text-anchor="middle" fill="#56d364" font-size="13" font-weight="600">APPROVE</text>
    <text x="600" y="290" text-anchor="middle" fill="#8b949e" font-size="11">POST /pay → Pix + HCS</text>

    <rect x="850" y="240" width="160" height="70" rx="10" fill="#f8514933" stroke="#f85149"/>
    <text x="930" y="270" text-anchor="middle" fill="#ff7b72" font-size="13" font-weight="600">RECUSA / REJECT</text>
    <text x="930" y="290" text-anchor="middle" fill="#8b949e" font-size="11">TIER_INSUFFICIENT + HCS</text>
  </g>

  <!-- tier table -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="12">
    <text x="40" y="350" fill="#e6edf3" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600">Tier map (product rule)</text>
    <text x="40" y="375" fill="#56d364">orb     Identity Check ✓   HIGH    max 1,000,000 units (10,000 BRL)  → can pay</text>
    <text x="40" y="395" fill="#e3b341">device  no Identity Check  MEDIUM  max   100,000 units ( 1,000 BRL)  → capped</text>
    <text x="40" y="415" fill="#ff7b72">none   no proof           ZERO    max         0                      → reject</text>
  </g>
</svg>