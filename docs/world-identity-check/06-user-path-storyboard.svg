<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <rect width="100%" height="100%" rx="12" fill="#0d1117"/>
  <text x="40" y="40" fill="#e6edf3" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700">User path — World App → Identity Check → tier → allowance</text>
  <text x="40" y="64" fill="#8b949e" font-family="Inter,system-ui,sans-serif" font-size="13">Real-user flow for World Identity Check Beta prize (screenshots of each step below in markdown)</text>
  <g font-family="Inter,system-ui,sans-serif" font-size="12">
    <!-- 5 steps -->
    <rect x="40" y="100" width="160" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="120" y="130" text-anchor="middle" fill="#79c0ff" font-weight="700">1. Open PIXPORT</text>
    <text x="120" y="155" text-anchor="middle" fill="#8b949e">Console / pay UI</text>
    <text x="120" y="175" text-anchor="middle" fill="#8b949e">Paste BR Code</text>
    <text x="120" y="195" text-anchor="middle" fill="#8b949e">Click Verify human</text>

    <rect x="220" y="100" width="160" height="120" rx="10" fill="#161b22" stroke="#a371f7"/>
    <text x="300" y="130" text-anchor="middle" fill="#d2a8ff" font-weight="700">2. IDKit widget</text>
    <text x="300" y="155" text-anchor="middle" fill="#8b949e">QR / deep link</text>
    <text x="300" y="175" text-anchor="middle" fill="#8b949e">action: pixport-payment</text>
    <text x="300" y="195" text-anchor="middle" fill="#8b949e">level: orb</text>

    <rect x="400" y="100" width="160" height="120" rx="10" fill="#161b22" stroke="#a371f7"/>
    <text x="480" y="130" text-anchor="middle" fill="#d2a8ff" font-weight="700">3. World App</text>
    <text x="480" y="155" text-anchor="middle" fill="#8b949e">User confirms</text>
    <text x="480" y="175" text-anchor="middle" fill="#8b949e">Orb credential</text>
    <text x="480" y="195" text-anchor="middle" fill="#8b949e">returns proof JSON</text>

    <rect x="580" y="100" width="160" height="120" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text x="660" y="130" text-anchor="middle" fill="#56d364" font-weight="700">4. Agent gate</text>
    <text x="660" y="155" text-anchor="middle" fill="#8b949e">verifyCloudProof</text>
    <text x="660" y="175" text-anchor="middle" fill="#8b949e">tier = HIGH (orb)</text>
    <text x="660" y="195" text-anchor="middle" fill="#8b949e">HIP-336 remaining OK</text>

    <rect x="760" y="100" width="180" height="120" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text x="850" y="130" text-anchor="middle" fill="#56d364" font-weight="700">5. Pay + audit</text>
    <text x="850" y="155" text-anchor="middle" fill="#8b949e">POST /pay → Pix</text>
    <text x="850" y="175" text-anchor="middle" fill="#8b949e">HCS PAYMENT_APPROVED</text>
    <text x="850" y="195" text-anchor="middle" fill="#8b949e">HashScan topic link</text>
  </g>
  <text x="40" y="270" fill="#e6edf3" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600">Unverified / device-only path (RECUSA by tier)</text>
  <text x="40" y="295" fill="#ff7b72" font-family="ui-monospace,Menlo,monospace" font-size="12">no proof → tier none → TIER_INSUFFICIENT (immediate) · device + amount&gt;1000 BRL → TIER_INSUFFICIENT (cap)</text>
  <text x="40" y="320" fill="#8b949e" font-family="Inter,system-ui,sans-serif" font-size="12">Both rejections write PAYMENT_REJECTED to HCS topic 0.0.9742958 — same audit trail as ledger RECUSA.</text>
  <text x="40" y="345" fill="#8b949e" font-family="Inter,system-ui,sans-serif" font-size="12">Live audit: https://hashscan.io/testnet/topic/0.0.9742958</text>
</svg>